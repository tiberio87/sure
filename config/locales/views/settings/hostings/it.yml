        model_placeholder: "claude-sonnet-4-6 (predefinito)"
        model_help: Usato per chat ed elaborazione PDF. Le operazioni batch (categorizza, rilevamento commercianti) usano Haiku per il costo.
      openai_settings:
        description: Inserisci il token di accesso e opzionalmente configura un provider compatibile con OpenAI personalizzato
        env_configured_message: Configurato con successo tramite variabili d'ambiente.
        access_token_label: Token di accesso
        access_token_placeholder: Inserisci il tuo token di accesso qui
        uri_base_label: URL base API (facoltativo)
        uri_base_placeholder: "https://api.openai.com/v1 (predefinito)"
        uri_base_local_help: "Per un modello sulla tua macchina, inserisci il suo endpoint compatibile con OpenAI, ad esempio Ollama su http://localhost:11434/v1, oppure http://ollama:11434/v1 se Sure e Ollama girano come servizi Docker Compose."
        model_label: Modello (facoltativo)
        model_placeholder: "gpt-4.1 (predefinito)"
        model_required_help: "Obbligatorio quando imposti un URL di base dell'API: inserisci il nome del modello usato dal tuo server, ad esempio llama3.1 per Ollama."
        json_mode_label: Modalità JSON
        json_mode_auto: Auto (consigliato)
        json_mode_strict: Strict (ottimo per modelli thinking)
        json_mode_none: Nessuno (ottimo per modelli standard)
        json_mode_json_object: Oggetto JSON
        json_mode_help: "La modalità Strict funziona meglio con i modelli thinking (qwen-thinking, deepseek-reasoner). La modalità None funziona meglio con i modelli standard (llama, mistral, gpt-oss)."
        budget_heading: Budget token
        budget_description: Si applica alle chiamate compatibili con OpenAI (chat, auto-categorizzazione, rilevamento commercianti ed elaborazione PDF). I valori predefiniti sono conservativi per i modelli locali a contesto ridotto. Aumenta per i modelli cloud con finestre di contesto più grandi.
        context_window_label: Finestra di contesto (facoltativo)
        context_window_help: "Token totali che il modello accetterà. Predefinito: 2048 — aumenta a 8192+ per OpenAI cloud o modelli locali a contesto ampio."
        max_response_tokens_label: Token risposta massimi (facoltativo)
        max_response_tokens_help: "Token riservati per la risposta del modello. Predefinito: 512. Diminuisci per liberare spazio per cronologie più lunghe."
        title: OpenAI
        max_items_per_call_label: Elementi massimi per batch (facoltativo)
        max_items_per_call_help: "Limite superiore per batch di auto-categorizzazione/rilevamento esercenti. Predefinito: 25. I batch più grandi vengono suddivisi automaticamente per adattarsi alla finestra di contesto."
        model_function_calling_help: L'assistente AI legge i tuoi dati tramite chiamate di funzione, quindi scegli un modello che il tuo provider indica come compatibile con tools/function calling. I modelli senza questo supporto fanno fallire la chat con un errore del provider poco chiaro.
        model_function_calling_link: Verifica il modello configurato
        timeout_heading: Timeout
        timeout_description: Controlla per quanto tempo possono durare le chiamate ai modelli compatibili con OpenAI prima che Sure rinunci. Aumenta questi valori se esegui un modello locale su hardware lento.
        openai_request_timeout_label: Timeout richiesta in secondi (facoltativo)
        openai_request_timeout_help: 'Predefinito: 60. Si applica a ogni richiesta HTTP compatibile con OpenAI, incluse auto-categorizzazione, rilevamento esercenti, chat, elaborazione PDF e chiamate al vector store. OPENAI_REQUEST_TIMEOUT sovrascrive questo campo.'
        ai_response_timeout_label: Timeout risposta in secondi (facoltativo)
        ai_response_timeout_help: 'Predefinito: 90. Si applica solo al watchdog dell''intero turno di chat, quindi dimensionalo come una somma: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × timeout richiesta, più il tempo di esecuzione degli strumenti e di attesa in coda. AI_RESPONSE_TIMEOUT sovrascrive questo campo.'
        ai_health_probe_timeout_label: "Timeout del controllo di stato in secondi (facoltativo)"
        ai_health_probe_timeout_help: "Predefinito: 5. Si applica solo ai controlli IA in tempo reale in Impostazioni → Stato del sistema, mai alle chiamate IA effettive. Aumentalo se i controlli PDF scadono con un modello cloud. AI_HEALTH_PROBE_TIMEOUT ha la precedenza su questo campo."
