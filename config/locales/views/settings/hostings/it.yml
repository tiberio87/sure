        not_configured_hint: "Aggiungi una chiave API %{provider} qui sotto per attivarlo."
        data_retention_heading: Gestione dati
        data_retention: Gli input API non vengono usati per addestrare modelli per impostazione predefinita; le API hosted dei provider conservano i dati per ~30 giorni per fiducia e sicurezza. Gli endpoint personalizzati o self-hosted seguono la tua politica.
        max_items_per_call_label: Elementi massimi per batch (facoltativo)
        max_items_per_call_help: "Limite superiore per batch di auto-categorizzazione/rilevamento commercianti. Predefinito: 25. Con provider compatibili con OpenAI, i batch più grandi vengono suddivisi automaticamente per adattarsi alla finestra di contesto."
