        weight_hint: "Determina cosa viene applicato: le celle in grassetto, dove il numero di risposte corrette meno questo costo per ogni errore è massimo. Imposta la soglia migliore per le categorie e, per il riconoscimento esercenti, il limite, la somiglianza e il numero di esercenti."
        weight_option:
          one: 1 risposta corretta
          other: "%{count} risposte corrette"
      matcher:
        lock_similar_merchants: Blocca gli esercenti assegnati dal riconoscimento automatico
        lock_similar_merchants_hint: Impedisce a regole, IA e sincronizzazioni di modificarli, salvo quando premi Applica su una regola. I blocchi automatici non valgono come conferme per l'ottimizzazione del riconoscimento esercenti.
        rule: Completa gli esercenti mancanti usando le transazioni simili
        rule_hint: "La regola di riconoscimento esercenti si attiva o disattiva anche dalla sezione Regole. Nell'ordine definito, assegna alle transazioni senza esercente quello presente nelle transazioni con descrizioni simili, ad esempio «NETFLIX.COM 8812» e «Netflix com». I trasferimenti sono esclusi."
        similar_threshold: Somiglianza
        similar_threshold_hint: "Somiglianza minima tra le descrizioni, ignorando numeri e codici di riferimento (0,5–0,99). Una soglia più bassa completa più esercenti ma causa più errori. Anche Applica dell'ottimizzazione automatica imposta questa soglia."
      matcher_tuning:
        similar_common_share: Limite di frequenza
        similar_common_share_hint: "Una parola o una sequenza di 3 lettere presente in una quota delle transazioni di origine superiore a questa soglia (0,01–1), e in almeno 50 di esse, è troppo comune per distinguerle, come «carta» o «pagamento», e viene ignorata. Aumentando la soglia ne vengono considerate di più. Anche Applica dell'ottimizzazione automatica imposta questo valore."
        similar_min_neighbours: Esercenti concordanti
        similar_min_neighbours_hint: Numero minimo di transazioni simili con lo stesso esercente e nessuna con un esercente diverso. Con 1 viene copiata una sola transazione, anche se sbagliata.
        similar_min_neighbours_option:
          one: 1 esercente
          other: "%{count} esercenti"
        similar_skip_self: Non copiare gli esercenti assegnati automaticamente finché non sono confermati o non trascorrono questi giorni
        similar_skip_self_hint: Confermato significa che hai modificato o bloccato l'esercente. Un'associazione sbagliata non viene propagata; se resta invariata abbastanza a lungo viene considerata accettata.
      merchant:
        merchant_field: Considera l'esercente come un unico token, se presente
        merchant_field_hint: Considera l'identità dell'esercente, così conserva la cronologia anche se viene rinominato.
        merchant_name_words: Considera le parole del nome dell'esercente
        merchant_name_words_hint: Analizza il nome come una descrizione, come fa il classificatore originale, così nomi simili condividono gli stessi indizi. Si sovrappone al token precedente.
      run:
        success: Bayes sta categorizzando le transazioni senza categoria. Potrebbero essere necessari alcuni istanti.
      scoring:
        complement: Usa il modello naive Bayes complementare
        complement_hint: Valuta ogni categoria in base a quanto la transazione si discosta dalle altre, gestendo meglio categorie di dimensioni molto diverse. Se disattivato usa il modello multinomiale originale.
        prior: Considera la frequenza di utilizzo di ogni categoria
        prior_hint: Favorisce le categorie più utilizzate. Se disattivato considera tutte le categorie ugualmente probabili, come il modello originale.
        separate_fields: Valuta esercente e conto separatamente dalle parole
        separate_fields_hint: Ciascuno usa una propria distribuzione, così una descrizione lunga non ne annulla il peso. Richiede l'inclusione dell'esercente o del conto; l'importo viene sempre valutato separatamente.
        smoothing: Livellamento
        smoothing_hint: "Aggiunge un valore a ogni conteggio per non escludere una categoria in presenza di parole mai viste (0,001–10). Il valore originale è 1; valori inferiori danno maggiore peso ai dati osservati."
      show:
        add_rule_body: "La regola %{name} non è presente nell'elenco e quindi non può essere attivata. Aggiungerla in cima?"
        add_rule_cancel: "No"
        add_rule_confirm: Aggiungi regola
        add_rule_title: "Aggiungere la regola %{name}?"
