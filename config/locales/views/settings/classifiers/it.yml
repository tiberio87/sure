        lock_results_hint: Impedisce alle regole di modificare le scelte di Bayes, salvo quando premi Applica su una regola. L'IA non modifica mai le scelte di Bayes, anche se non sono bloccate.
        rule: Categorizza con il classificatore
        rule_hint: La regola Classificatore categorie si attiva o disattiva anche dalla sezione Regole. Dopo ogni sincronizzazione categorizza, nell'ordine delle regole, le transazioni senza categoria. Quelle incerte vengono lasciate alla regola di categorizzazione automatica.
        threshold: Soglia
        threshold_hint: Punteggio minimo necessario perché Bayes intervenga (0,05–0,99). Valori più bassi categorizzano più transazioni, ma aumentano gli errori.
      clear_locks:
        success: I blocchi di Bayes vengono rimossi. Potrebbero essere necessari alcuni istanti.
      evaluation:
        apply_best: Applica queste impostazioni
        best: Migliore configurazione trovata
        best_changes: "Migliore configurazione trovata, differenze rispetto alla tua:"
        best_no_changes: Nessuna configurazione ha ottenuto un punteggio migliore della tua.
        buttons_hint: "Testa le mie impostazioni valuta la configurazione attuale. Trova le impostazioni migliori cerca nei %{tuning} mesi precedenti a quelli mostrati, poi valuta i risultati su mesi non usati per l'addestramento. Usa ROC-AUC: misura quanto i punteggi distinguono le transazioni di ciascuna categoria dalle altre, a qualsiasi soglia. Una modifica viene mantenuta soltanto se migliora il risultato complessivo e quello di tutti i %{tuning} mesi, tranne al massimo uno. Prima prova le combinazioni degli input (token dell'esercente, importo e conto; punteggi separati per esercente e conto; nome dell'esercente e note come parole), quindi modifica una impostazione per volta e infine prova i criteri di punteggio. I valori predefiniti sono quelli del classificatore originale, con le categorie scelte da te. Ripristina predefiniti li riattiva e li verifica."
        categories_heading: Classificatore delle categorie
