        search_categories: Cerca categorie
        skip_self_labels: Non apprendere dalle previsioni di Bayes finché non vengono confermate o non trascorrono questi giorni
        skip_self_labels_hint: Confermato significa che hai modificato o bloccato il risultato. Una previsione sbagliata non viene riutilizzata e rafforzata; se resta invariata abbastanza a lungo viene considerata accettata.
