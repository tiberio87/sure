        matcher: Riconoscimento esercenti
        matcher_description: Completa gli esercenti mancanti usando transazioni con descrizioni simili, tramite la regola di riconoscimento esercenti (dopo ogni sincronizzazione) oppure con Esegui. Modifica gli esercenti salvati.
        matcher_tuning: Ottimizzazione del riconoscimento esercenti
        merchant: Ottimizzazione per esercente
        run: Esegui
        scoring: Punteggio
        title: Classificatore
        training: Addestramento
        words: Ottimizzazione delle descrizioni
      training:
        max_training_transactions: Transazioni per l'addestramento
        max_training_transactions_hint: "Numero massimo di transazioni recenti da usare (100–20.000): quelle categorizzate da cui apprende il classificatore e quelle con un esercente da cui il riconoscimento automatico prende i dati."
      words:
        bigrams: Considera le coppie di parole
        bigrams_hint: "Anche le parole adiacenti vengono considerate insieme, come «pagamento carta»."
        binary: Ignora le ripetizioni delle parole
        binary_hint: Ogni parola viene conteggiata una sola volta per transazione.
        drop_codes: Escludi i codici di riferimento
        drop_codes_hint: Parole che mescolano lettere e almeno 2 cifre, come 2k4l19.
        drop_numbers: Escludi i numeri
        drop_numbers_hint: Numeri, date e importi presenti nella descrizione.
        include_notes: Considera le note
        include_notes_hint: Analizza le note oltre al nome.
        keep_single_chars: Considera anche i caratteri singoli
        keep_single_chars_hint: "Lettere e cifre singole dopo la suddivisione del testo, come la «s» di mcdonald's."
        spread_filter: Escludi le parole usate in modo simile da tutte le categorie
        spread_filter_hint: Non aiutano a distinguere la categoria. Il valore indica quanto l'utilizzo in una categoria deve superare una distribuzione uniforme.
        word_split: Composizione delle parole
        word_split_ascii: da a a z e da 0 a 9
        word_split_hint: "Ogni altro carattere separa le parole. Le lettere di qualsiasi alfabeto mantengono unite parole come Geschäft o Кофейня; includendo simboli interni rimangono unite anche espressioni come mcdonald's, s/o e m&s (un simbolo all'inizio o alla fine, come in *netflix, viene comunque scartato)."
        word_split_symbols: Lettere, numeri e simboli interni
        word_split_unicode: Lettere e numeri di qualsiasi alfabeto
